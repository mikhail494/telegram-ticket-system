name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Lint source and tests
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check production TypeScript
        run: npm exec tsc -- -p tsconfig.json --noEmit

      - name: Check test TypeScript
        run: npm run test:typecheck

      - name: Run automated tests with coverage
        run: npm run test:coverage

      - name: Build application
        run: npm run build

      - name: Verify Docker image build
        run: docker build -t telegram-ticket-system-ci .

      - name: Verify Docker runtime invariants
        run: |
          test "$(docker image inspect telegram-ticket-system-ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect telegram-ticket-system-ci --format '{{.Config.WorkingDir}}')" = "/app"
          test "$(docker image inspect telegram-ticket-system-ci --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^DATA_DIR=')" = "DATA_DIR=/data"
          docker image inspect telegram-ticket-system-ci --format '{{json .Config.Healthcheck}}' | grep -q 'healthz'
