name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Check architectural boundaries
        run: npm run architecture:check

      - name: Lint source and tests
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check production TypeScript
        run: npm exec tsc -- -p tsconfig.json --noEmit

      - name: Check test TypeScript
        run: npm run test:typecheck

      - name: Run automated tests with coverage
        run: npm run test:coverage

      - name: Build application
        run: npm run build

      - name: Verify Docker image build
        run: docker build -t telegram-ticket-system-ci .

      - name: Verify Docker runtime invariants
        run: |
          test "$(docker image inspect telegram-ticket-system-ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect telegram-ticket-system-ci --format '{{.Config.WorkingDir}}')" = "/app"
          test "$(docker image inspect telegram-ticket-system-ci --format '{{json .Config.Healthcheck}}')" != "null"
          docker image inspect telegram-ticket-system-ci --format '{{json .Config.Healthcheck}}' | grep -q 'readyz'
          docker image inspect telegram-ticket-system-ci --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx 'DATABASE_URL=file:/data/support.db'
          docker image inspect telegram-ticket-system-ci --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx 'OPS_HTTP_ENABLED=true'
          docker image inspect telegram-ticket-system-ci --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx 'OPS_HTTP_HOST=0.0.0.0'
          docker image inspect telegram-ticket-system-ci --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx 'OPS_HTTP_PORT=3000'
          docker run --rm --entrypoint node telegram-ticket-system-ci --version | grep -Eq '^v24\.'
          docker run --rm --entrypoint node telegram-ticket-system-ci -e "import { accessSync, constants } from 'node:fs'; if (process.getuid() === 0) process.exit(1); accessSync('/data', constants.W_OK);"
          docker run --rm --env BOT_TOKEN=123456:CI_SYNTHETIC_ONLY --entrypoint node telegram-ticket-system-ci --input-type=module -e '
            import assert from "node:assert/strict";
            import { randomBytes } from "node:crypto";
            import { statSync } from "node:fs";
            import { OperationalServer } from "./dist/operationsHttp.js";
            import { SupportDatabase } from "./dist/db.js";
            import { RuntimeHealthRegistry } from "./dist/runtimeObservability.js";
            assert.equal(process.env.OPS_METRICS_TOKEN, undefined);
            const db = new SupportDatabase("file:/data/ci.sqlite");
            assert.equal(statSync("/data/.adaptive-private/adaptive.key").mode & 0o777, 0o600);
            assert.equal(statSync("/data/.adaptive-private").mode & 0o777, 0o700);
            db.close();
            const health = new RuntimeHealthRegistry({ backupEnabled: false, backupIntervalMs: 1 });
            health.setRuntimeState("READY"); health.markPollingStarted();
            const background = { accepting: true, inFlight: 0, acceptedTotal: 0, rejectedTotal: 0, completedTotal: 0, failedTotal: 0 };
            for (const metricsToken of [undefined, randomBytes(32).toString("base64url")]) {
              const server = new OperationalServer({ host: "0.0.0.0", port: 0, metricsToken, getSnapshot: () => health.snapshot(background), checkDatabase: () => true, recordDatabaseProbe: () => {} });
              await server.start();
              try {
                const url = `http://127.0.0.1:${server.port}`;
                assert.equal((await fetch(`${url}/healthz`)).status, 200);
                assert.equal((await fetch(`${url}/readyz`)).status, 200);
                assert.equal((await fetch(`${url}/metrics`)).status, 401);
                if (metricsToken) assert.equal((await fetch(`${url}/metrics`, { headers: { Authorization: `Bearer ${metricsToken}` } })).status, 200);
              } finally { await server.stop(); }
            }
          '
