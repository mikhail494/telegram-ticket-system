name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint source and tests
        run: npm run lint

      - name: Check production TypeScript
        run: npm exec tsc -- -p tsconfig.json --noEmit

      - name: Check test TypeScript
        run: npm run test:typecheck

      - name: Run automated tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Verify Docker image build
        run: docker build -t telegram-ticket-system-ci .

      - name: Verify Docker runtime invariants
        run: |
          test "$(docker image inspect telegram-ticket-system-ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect telegram-ticket-system-ci --format '{{json .Config.Healthcheck}}')" != "null"
          docker image inspect telegram-ticket-system-ci --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx 'DATABASE_URL=file:/data/support.db'
          docker image inspect telegram-ticket-system-ci --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx 'OPS_HTTP_ENABLED=true'
          docker image inspect telegram-ticket-system-ci --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx 'OPS_HTTP_HOST=0.0.0.0'
          docker image inspect telegram-ticket-system-ci --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Fx 'OPS_HTTP_PORT=3000'
          docker run --rm --entrypoint node telegram-ticket-system-ci -e "import { accessSync, constants } from 'node:fs'; if (process.getuid() === 0) process.exit(1); accessSync('/data', constants.W_OK);"
