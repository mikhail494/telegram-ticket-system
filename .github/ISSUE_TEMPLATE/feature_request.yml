name: Feature request
description: Propose a focused product or operator-workflow improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed behavior. Keep production credentials and real support data out of the issue.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete limitation or operator/user problem should be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note workarounds or simpler alternatives you considered.

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and operational impact
      description: Mention any expected effect on Telegram UX, callbacks, permissions, database state, recovery, deployment, or dependencies.
      placeholder: "None, or describe the impact."

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request does not contain secrets or private support data.
          required: true
